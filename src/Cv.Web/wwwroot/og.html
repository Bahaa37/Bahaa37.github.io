<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Link preview source</title>
    <!--
        Source for og-preview.png, captured at exactly 1200x630 by
        _tools/make_og_image.py. It is a plain static page rather than a screenshot of
        the app so the composition is deliberate and does not shift when the site
        design changes. Not routed by the app; nothing links to it.
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 76px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            color: #eef4f9;
            background:
                radial-gradient(120% 100% at 8% -20%, #1d4a68 0%, transparent 58%),
                radial-gradient(90% 90% at 105% 115%, #14425f 0%, transparent 55%),
                #0d151c;
            overflow: hidden;
        }

        .location {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #7fa9c6;
        }

        h1 {
            margin-top: 16px;
            font-size: 78px;
            line-height: 1.02;
            letter-spacing: -.03em;
        }

        .role {
            margin-top: 16px;
            font-size: 30px;
            font-weight: 600;
            color: #8ec6ea;
        }

        .rule {
            width: 92px;
            height: 4px;
            margin: 30px 0;
            background: #d8a63f;
            border-radius: 2px;
        }

        .facts {
            display: flex;
            gap: 52px;
        }

        .fact__label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #7d8d9c;
        }

        .fact__value {
            margin-top: 6px;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .fact--gold .fact__value { color: #e0b95f; }
    </style>
</head>

<body>
    <p class="location">Alexandria, Egypt</p>
    <h1>Bahaa Aldeen<br />Mohamed</h1>
    <p class="role">Senior .NET Full-Stack Software Engineer</p>

    <div class="rule"></div>

    <div class="facts">
        <div class="fact fact--gold">
            <div class="fact__label">Upgrade cycle</div>
            <div class="fact__value">5–7 days → 3</div>
        </div>
        <div class="fact">
            <div class="fact__label">Payment markets</div>
            <div class="fact__value">9 countries</div>
        </div>
        <div class="fact">
            <div class="fact__label">Focus</div>
            <div class="fact__value">Legacy modernization</div>
        </div>
    </div>
</body>

</html>
