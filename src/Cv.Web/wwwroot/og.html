<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Link preview source</title>
    <!--
        Source for og-preview.png, captured at exactly 1200x630 by
        _tools/make_og_image.py. It is a plain static page rather than a screenshot of
        the app so the composition is deliberate and does not shift when the site
        design changes. Not routed by the app; nothing links to it.
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 76px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            color: #16222e;
            /* The site's anodized-aluminum day ground, composed once for the 1200x630
               frame: silvery blue with one soft sky light. A light card among dark
               ones is what stands out in a feed. */
            background:
                radial-gradient(64% 74% at 8% -12%, #edf8ff 0%, transparent 62%),
                linear-gradient(135deg, #f2f8fe 0%, #e8f2ff 55%, #dbf1ff 100%);
            overflow: hidden;
        }

        .location {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #5c7086;
        }

        h1 {
            margin-top: 16px;
            font-size: 78px;
            line-height: 1.02;
            letter-spacing: -.03em;
        }

        .role {
            margin-top: 16px;
            font-size: 28px;
            font-weight: 600;
            color: #0e6398;
        }

        .rule {
            width: 92px;
            height: 4px;
            margin: 30px 0;
            border-radius: 2px;
            background: linear-gradient(90deg, #8ea1b2, #c9d5e0 55%, #8ea1b2);
        }

        .facts {
            display: flex;
            gap: 52px;
        }

        .fact__label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            /* Held past 4.5:1 against the darkest patch AND the worst case of a glow
               centre composited over the ground — the previous value failed AA and the
               design detector kept catching it. */
            color: #44586b;
        }

        .fact__value {
            margin-top: 6px;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .fact--gold .fact__value { color: #e0b95f; }
    </style>
</head>

<body>
    <p class="location">Alexandria, Egypt</p>
    <h1>Bahaa Aldeen<br />Mohamed</h1>
    <p class="role">Senior .NET Engineer — Legacy Modernization &amp; Solution Architecture</p>

    <div class="rule"></div>

    <div class="facts">
        <div class="fact fact--gold">
            <div class="fact__label">Upgrade cycle</div>
            <div class="fact__value">5–7 days → 3</div>
        </div>
        <div class="fact">
            <div class="fact__label">Payment markets</div>
            <div class="fact__value">9 countries</div>
        </div>
        <div class="fact">
            <div class="fact__label">Focus</div>
            <div class="fact__value">Legacy modernization</div>
        </div>
    </div>
</body>

</html>
