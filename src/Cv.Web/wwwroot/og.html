<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Link preview source</title>
    <!--
        Source for og-preview.png, captured at exactly 1200x630 by
        _tools/make_og_image.py. It is a plain static page rather than a screenshot of
        the app so the composition is deliberate and does not shift when the site
        design changes. Not routed by the app; nothing links to it.
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 76px;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            color: #f5f5f7;
            /* The aurora field, frozen: the same three hues the site drifts through,
               composed once for the 1200x630 frame. */
            background:
                radial-gradient(52% 60% at 12% -8%, rgba(10, 132, 255, .5) 0%, transparent 60%),
                radial-gradient(44% 52% at 100% 16%, rgba(90, 200, 216, .38) 0%, transparent 62%),
                radial-gradient(50% 58% at 78% 118%, rgba(125, 122, 255, .42) 0%, transparent 60%),
                #0b1220;
            overflow: hidden;
        }

        .location {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #a9c7de;
        }

        h1 {
            margin-top: 16px;
            font-size: 78px;
            line-height: 1.02;
            letter-spacing: -.03em;
        }

        .role {
            margin-top: 16px;
            font-size: 28px;
            font-weight: 600;
            color: #8abaff;
        }

        .rule {
            width: 92px;
            height: 4px;
            margin: 30px 0;
            background: #d8a63f;
            border-radius: 2px;
        }

        .facts {
            display: flex;
            gap: 52px;
        }

        .fact__label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            /* Held past 4.5:1 against the darkest patch AND the worst case of a blob
               centre composited over the ground — the previous value failed AA and the
               design detector kept catching it. */
            color: #c6d3e0;
        }

        .fact__value {
            margin-top: 6px;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .fact--gold .fact__value { color: #e0b95f; }
    </style>
</head>

<body>
    <p class="location">Alexandria, Egypt</p>
    <h1>Bahaa Aldeen<br />Mohamed</h1>
    <p class="role">Senior .NET Engineer — Legacy Modernization &amp; Solution Architecture</p>

    <div class="rule"></div>

    <div class="facts">
        <div class="fact fact--gold">
            <div class="fact__label">Upgrade cycle</div>
            <div class="fact__value">5–7 days → 3</div>
        </div>
        <div class="fact">
            <div class="fact__label">Payment markets</div>
            <div class="fact__value">9 countries</div>
        </div>
        <div class="fact">
            <div class="fact__label">Focus</div>
            <div class="fact__value">Legacy modernization</div>
        </div>
    </div>
</body>

</html>
