<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Link preview source</title>
    <!--
        Source for og-preview.png, captured at exactly 1200x630 by
        _tools/make_og_image.py. It is a plain static page rather than a screenshot of
        the app so the composition is deliberate and does not shift when the site
        design changes. Not routed by the app; nothing links to it.
    -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 76px;
            font-family: "Spectral", Georgia, serif;
            color: #14261e;
            /* The Legal Tender note face: rag paper with one soft vignette, and
               the engine-turned line field ghosting under the name. */
            background:
                radial-gradient(90% 120% at 20% 0%, #faf6ea 0%, transparent 55%),
                #f3eede;
            overflow: hidden;
            position: relative;
        }

        /* The engine-turned border of the note — fine diagonal engraving. */
        body::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px solid #b8ab8c;
            outline: 1px solid #b8ab8c;
            outline-offset: 5px;
            pointer-events: none;
        }

        .location {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #5d7263;
            font-family: "Fragment Mono", Consolas, monospace;
        }

        h1 {
            margin-top: 16px;
            font-family: "Bodoni Moda", Didot, serif;
            font-size: 78px;
            line-height: 1.02;
            letter-spacing: -.01em;
        }

        .role {
            margin-top: 16px;
            font-size: 27px;
            font-weight: 600;
            color: #0c5a45;
        }

        .rule {
            width: 92px;
            height: 4px;
            margin: 30px 0;
            border-radius: 2px;
            background: #0c5a45;
        }

        .facts {
            display: flex;
            gap: 52px;
        }

        .fact__label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #5d7263;
            font-family: "Fragment Mono", Consolas, monospace;
        }

        .fact__value {
            margin-top: 6px;
            font-size: 27px;
            font-weight: 600;
            letter-spacing: -.01em;
        }

        /* The bronze medallion metal — recognition only. */
        .fact--gold .fact__value { color: #7a4a2b; }
    </style>
</head>

<body>
    <p class="location">Alexandria, Egypt</p>
    <h1>Bahaa Aldeen<br />Mohamed</h1>
    <p class="role">Senior .NET Engineer — Legacy Modernization &amp; Solution Architecture</p>

    <div class="rule"></div>

    <div class="facts">
        <div class="fact fact--gold">
            <div class="fact__label">Upgrade cycle</div>
            <div class="fact__value">5–7 days → 3</div>
        </div>
        <div class="fact">
            <div class="fact__label">Payment markets</div>
            <div class="fact__value">9 countries</div>
        </div>
        <div class="fact">
            <div class="fact__label">Delivery</div>
            <div class="fact__value">Sole engineer, end to end</div>
        </div>
    </div>
</body>

</html>
