<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Link preview source</title>
    <!--
        Source for og-preview.png, captured at exactly 1200x630 by
        _tools/make_og_image.py. A plain static page rather than a screenshot of the
        app, so the composition is deliberate. Not routed by the app; nothing links
        to it. Spec Sheet world (2026-10-04): the previous card said "Sole engineer,
        end to end", which is the framing the site no longer leads with.
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 80px;
            font-family: "Geist", "Segoe UI", Arial, sans-serif;
            color: #111827;
            background: #f7f8fa;
            overflow: hidden;
            border-top: 10px solid #111827;
        }

        .who {
            font-family: "Geist Mono", Consolas, monospace;
            font-size: 22px;
            color: #5b6472;
        }

        h1 {
            margin-top: 18px;
            font-size: 72px;
            font-weight: 650;
            line-height: 1.04;
            letter-spacing: -.045em;
        }

        h1 span { color: #111827; }

        .facts {
            display: flex;
            margin-top: 48px;
            border: 1px solid #dce0e6;
            border-radius: 12px;
            background: #fff;
            width: fit-content;
        }

        .fact { padding: 22px 34px; border-right: 1px solid #dce0e6; }
        .fact:last-child { border-right: 0; }

        .fact__value {
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -.04em;
            line-height: 1;
        }

        .fact__label {
            margin-top: 8px;
            font-size: 18px;
            color: #374151;
        }
    </style>
</head>

<body>
    <p class="who">Bahaa Aldeen Mohamed · Senior .NET Engineer · Alexandria, Egypt</p>
    <h1>I make the architecture decisions,<br /><span>then I write the code.</span></h1>

    <div class="facts">
        <div class="fact">
            <div class="fact__value">9</div>
            <div class="fact__label">countries, one payment API</div>
        </div>
        <div class="fact">
            <div class="fact__value">5–7 → 3</div>
            <div class="fact__label">days per upgrade cycle</div>
        </div>
        <div class="fact">
            <div class="fact__value">14</div>
            <div class="fact__label">ADRs behind a multi-tenant SaaS</div>
        </div>
    </div>
</body>

</html>
