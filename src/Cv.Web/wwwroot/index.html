<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static title and description: crawlers and search engines read these without
         executing the WebAssembly runtime, so they must match the site's positioning
         rather than lag behind it. -->
    <title>Bahaa Aldeen Mohamed — Solution Architecture &amp; Systems Analysis</title>
    <meta name="description" content="Solution architect and systems analyst in the .NET ecosystem. Removed a distributed transaction coordinator dependency that had frozen a service estate, cutting an upgrade cycle from 5-7 days to 3. Clean Architecture, CQRS, payment infrastructure across 9 countries." />
    <base href="/" />

    <!--
        Link-preview tags are static and live here rather than being set by the app.

        This site is client-rendered, so LinkedIn, WhatsApp, and Slack crawlers see only
        this file — they do not execute the WebAssembly runtime. A link pasted to a
        recruiter is the primary way this page gets shared, so these tags matter more
        than search ranking does.
    -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Bahaa Aldeen Mohamed" />
    <meta property="og:url" content="https://bahaa37.github.io/" />
    <meta property="og:title" content="Bahaa Aldeen Mohamed — Solution Architecture &amp; Systems Analysis" />
    <meta property="og:description" content="I remove the constraint that froze the estate. Removed a distributed transaction coordinator dependency and cut an upgrade cycle from 5-7 days to 3. .NET, Clean Architecture, CQRS." />

    <!-- Absolute, not relative. LinkedIn, WhatsApp and Slack crawlers routinely ignore a
         relative og:image, which would leave a shared link with no thumbnail — the exact
         failure these tags exist to prevent. -->
    <meta property="og:image" content="https://bahaa37.github.io/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bahaa Aldeen Mohamed — Solution Architecture and Systems Analysis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bahaa37.github.io/og-preview.png" />

    <link rel="preload" id="webassembly" />

    <!-- Google Fonts is the one external host the page loads from; every face has a
         real fallback stack so the page is readable before they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/print.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Cv.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
