name: Deploy to GitHub Pages

# Primary deployment target.
#
# The portfolio URL is printed on a CV that gets emailed to employers, so it has to read
# as permanent — an Azure Static Web Apps free-tier subdomain (calm-sand-0123.azure...)
# does not. A GitHub Pages *user site* gives https://bahaa37.github.io, which is clean,
# free, and served at the domain root, so the app's base href stays "/" unchanged.
#
# Requires the repository to be named exactly `Bahaa37.github.io`, and Settings → Pages →
# Source set to "GitHub Actions".
#
# deploy.yml (Azure Static Web Apps) remains as an optional second target.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Gate the deploy on the content rules as well as the code. A timeline that says
      # two full-time jobs overlapped, or a bullet claiming a .NET version that had not
      # shipped, must never reach a recruiter.
      - name: Test
        run: dotnet test tests/Cv.Tests/Cv.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish src/Cv.Web/Cv.Web.csproj --configuration Release --output publish

      # GitHub Pages runs Jekyll by default, which ignores directories beginning with an
      # underscore -- that would silently drop the entire _framework folder and leave a
      # blank page with no build error.
      - name: Disable Jekyll processing
        run: touch publish/wwwroot/.nojekyll

      # Write a real page for every route: its own title, description, canonical, Open
      # Graph tags, JSON-LD and text content — plus sitemap.xml, robots.txt and llms.txt.
      #
      # This replaces an earlier step that copied index.html to each route verbatim. That
      # gave deep links a 200 status, which was the point, but it also gave /cv and the
      # case study the SAME title, the SAME description and an og:url pointing at the
      # site root. To a crawler the site was three copies of one page.
      #
      # The route table lives in the script and is derived from cv.json, so adding a
      # write-up adds its page, its sitemap entry and its llms.txt line in one edit —
      # there is no longer a hand-maintained list here to forget.
      - name: Prerender routes
        run: |
          python -m pip install --quiet --upgrade pip
          python _tools/prerender.py publish/wwwroot --base-url https://bahaa37.github.io

      # Render the downloadable CV from the build that is about to ship, rather than
      # shipping a file someone exported by hand months ago. The PDF a recruiter
      # downloads then cannot disagree with the page they downloaded it from.
      #
      # ats_check.py is the acceptance criterion, not a formality: an applicant tracking
      # system reads the text layer, and a CV whose text does not extract is filtered out
      # before a person sees it. A failure here stops the deploy.
      - name: Render and gate the CV PDF
        run: |
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium
          python _tools/make_cv_pdf.py publish/wwwroot publish/wwwroot/Bahaa-Aldeen-Mohamed-CV.pdf
          python _tools/ats_check.py publish/wwwroot/Bahaa-Aldeen-Mohamed-CV.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
