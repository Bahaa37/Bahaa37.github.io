name: CI

# Build and test on every branch and pull request.
#
# pages.yml also runs the tests, but only on a push to main — which means a compile error
# or a content-rule violation was previously discovered *during* a deploy, with the
# broken commit already on the default branch. This workflow moves that feedback to the
# branch, where it is still cheap to act on. It publishes nothing.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tests cover the content rules as well as the code: CvValidator and
      # RealCvDocumentTests run against the live cv.json, so an edit to the CV is
      # checked here exactly as an edit to a record would be.
      - name: Test
        run: dotnet test tests/Cv.Tests/Cv.Tests.csproj --configuration Release

      # Publish with the same settings the deploy uses. Trimming is Release-only and has
      # broken this app before (DI activator constructors, System.Text.Json reflection
      # over required properties), so a Debug-only build would not prove much.
      - name: Publish
        run: dotnet publish src/Cv.Web/Cv.Web.csproj --configuration Release --output publish
