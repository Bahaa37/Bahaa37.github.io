name: Build and deploy

# Deploys the Blazor WebAssembly showcase to Azure Static Web Apps.
#
# The build step targets src/Cv.Web/Cv.Web.csproj directly rather than the solution.
# This repository uses the .NET 10 SDK's .slnx solution format, and pointing at the
# project sidesteps any question of whether the deploy action's build step recognises
# it. Nothing is lost: the project references pull in Cv.Domain and Cv.Application.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Gate the deploy on the test suite and the CV's own content rules. A broken
      # timeline or an anachronistic technology claim should never reach a recruiter.
      - name: Test
        run: dotnet test tests/Cv.Tests/Cv.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish src/Cv.Web/Cv.Web.csproj --configuration Release --output publish

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Already-built output; skip the action's own build.
          app_location: publish/wwwroot
          skip_app_build: true
          output_location: ''

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
